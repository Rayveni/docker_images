services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-harness-plugins
    container_name: dsh-harness
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3080:3080"
    volumes:
      - ${HOST_SETTINGS_PATH}:/root/.dsh
      - ${HOST_PROJECT_PATH}:/workspace
    environment:
      DSH_PROFILE: web
      PNPM_CONFIG_ONLY_BUILT_DEPENDENCIES: "false"
      CI: "true"
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"   # ← ключевая строка

    command: >
      sh -c "cd /tmp/plugins && sh ./install_plugins.sh || true; exec dsh web --no-open"

services:
  whisperx:
    build:
      context: ./docker/
      dockerfile: Dockerfile
      network: host
    user: root
    image: local_image/custom_whisperx
    volumes:
      - whisper_model_cache:/home/cache/model
      - data:/app/in

    environment:
      - hugging_token=${hugging_token}
      - model_save_path=/home/cache/model/hf_model
      - TORCH_HOME=/home/cache/torch
      - CACHE_HOME=/home/cache
      - HF_HOME=/home/cache/huggingface
      - PYANNOTE_CACHE=/home/cache/pyannote
      - PYTHONWARNINGS=ignore
      - EVENT_LEVEL=ERROR

    env_file:
      - .env 

volumes:
  whisper_model_cache:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${model_cashe}
  data:
